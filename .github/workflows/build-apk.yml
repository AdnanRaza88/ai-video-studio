name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Fresh Flutter Android project + inject app sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/avs-src
          cp -a flutter/lib /tmp/avs-src/
          cp flutter/pubspec.yaml /tmp/avs-src/
          if [ -f flutter/analysis_options.yaml ]; then cp flutter/analysis_options.yaml /tmp/avs-src/; fi
          if [ -d flutter/assets ]; then cp -a flutter/assets /tmp/avs-src/; else mkdir -p /tmp/avs-src/assets; fi

          # Remove incomplete platform tree so flutter create is clean
          rm -rf flutter
          flutter create --project-name ai_video_studio --org com.aivideostudio --platforms=android flutter

          rm -rf flutter/lib
          cp -a /tmp/avs-src/lib flutter/
          cp /tmp/avs-src/pubspec.yaml flutter/
          if [ -f /tmp/avs-src/analysis_options.yaml ]; then cp /tmp/avs-src/analysis_options.yaml flutter/; fi
          rm -rf flutter/assets
          cp -a /tmp/avs-src/assets flutter/

          # Ensure manifest asset exists
          test -f flutter/assets/model_manifest.json

          cd flutter
          flutter pub get
          flutter doctor -v || true

      - name: Build release APK
        working-directory: flutter
        run: flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-studio-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
