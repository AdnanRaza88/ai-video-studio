name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Bootstrap Flutter Android platform
        working-directory: flutter
        run: |
          set -e
          # Always regenerate Android platform files so the project is complete.
          # Our custom lib/ and MainActivity will be preserved / re-applied.
          flutter create . --project-name ai_video_studio --org com.aivideostudio --platforms=android

      - name: Restore custom MainActivity
        working-directory: flutter
        run: |
          mkdir -p android/app/src/main/kotlin/com/aivideostudio/app
          cat > android/app/src/main/kotlin/com/aivideostudio/app/MainActivity.kt << 'EOF'
          package com.aivideostudio.app

          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import io.flutter.plugin.common.EventChannel

          class MainActivity : FlutterActivity() {
              private val methodChannelName = "com.aivideostudio.app/native"
              private val eventChannelName = "com.aivideostudio.app/progress"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, methodChannelName)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "getDeviceCapabilities" -> {
                                  result.success(mapOf(
                                      "ramMb" to 0,
                                      "hasVulkan" to false,
                                      "androidVersion" to android.os.Build.VERSION.SDK_INT
                                  ))
                              }
                              "ping" -> result.success("pong")
                              else -> result.notImplemented()
                          }
                      }

                  EventChannel(flutterEngine.dartExecutor.binaryMessenger, eventChannelName)
                      .setStreamHandler(object : EventChannel.StreamHandler {
                          override fun onListen(arguments: Any?, events: EventChannel.EventSink?) {}
                          override fun onCancel(arguments: Any?) {}
                      })
              }
          }
          EOF

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze || true

      - name: Build APK
        working-directory: flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-studio-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
