name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Bootstrap Android platform (keep lib + assets)
        working-directory: flutter
        run: |
          set -e
          mkdir -p /tmp/avs-backup
          cp -a lib /tmp/avs-backup/
          cp -a pubspec.yaml /tmp/avs-backup/
          cp -a analysis_options.yaml /tmp/avs-backup/ 2>/dev/null || true
          cp -a assets /tmp/avs-backup/ 2>/dev/null || true

          flutter create . --project-name ai_video_studio --org com.aivideostudio --platforms=android

          rm -rf lib
          cp -a /tmp/avs-backup/lib .
          cp /tmp/avs-backup/pubspec.yaml .
          cp /tmp/avs-backup/analysis_options.yaml . 2>/dev/null || true
          if [ -d /tmp/avs-backup/assets ]; then cp -a /tmp/avs-backup/assets .; fi

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze || true

      - name: Build APK
        working-directory: flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-studio-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
