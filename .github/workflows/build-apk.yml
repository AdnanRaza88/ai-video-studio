name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Ensure Flutter project is complete
        working-directory: flutter
        run: |
          # If critical files are missing, bootstrap with flutter create then keep our lib/
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "Bootstrapping Flutter Android project..."
            flutter create . --project-name ai_video_studio --org com.aivideostudio --platforms=android
          fi
          flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze || true

      - name: Build APK
        working-directory: flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-studio-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
