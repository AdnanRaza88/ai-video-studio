name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Fresh Flutter Android project + inject app sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/avs-src
          cp -a flutter/lib /tmp/avs-src/
          cp flutter/pubspec.yaml /tmp/avs-src/
          if [ -f flutter/analysis_options.yaml ]; then cp flutter/analysis_options.yaml /tmp/avs-src/; fi
          if [ -d flutter/assets ]; then cp -a flutter/assets /tmp/avs-src/; else mkdir -p /tmp/avs-src/assets; fi

          find /tmp/avs-src/lib -type f -name '*.dart' -size -40c -delete || true

          rm -rf flutter
          flutter create --project-name ai_video_studio --org com.aivideostudio --platforms=android flutter

          rm -rf flutter/lib
          cp -a /tmp/avs-src/lib flutter/
          cp /tmp/avs-src/pubspec.yaml flutter/
          if [ -f /tmp/avs-src/analysis_options.yaml ]; then cp /tmp/avs-src/analysis_options.yaml flutter/; fi
          rm -rf flutter/assets
          cp -a /tmp/avs-src/assets flutter/

          cat > flutter/test/widget_test.dart << 'EOF'
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test('placeholder', () {
              expect(1 + 1, 2);
            });
          }
          EOF

          sed -i 's/compileSdk = .*/compileSdk = 35/' flutter/android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' flutter/android/app/build.gradle || true

          # Cleartext for Ollama LAN
          if [ -f flutter/android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' flutter/android/app/src/main/AndroidManifest.xml || true
          fi

          echo "=== lib tree ==="
          find flutter/lib -type f | sort
          test -f flutter/assets/model_manifest.json
          cd flutter
          flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/flutter-analyze.log

      - name: Build release APK
        working-directory: flutter
        run: |
          set -euo pipefail
          flutter build apk --release 2>&1 | tee /tmp/flutter-build.log
          echo "=== APK search ==="
          find build -name "*.apk" -type f 2>/dev/null || true

      - name: Stage APK for upload
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk-out
          APK=$(find flutter/build -name "app-release.apk" -type f | head -n1 || true)
          if [ -z "$APK" ]; then
            APK=$(find flutter/build -name "*.apk" -type f | head -n1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "No APK found"
            find flutter/build -type f | head -50 || true
            exit 1
          fi
          cp "$APK" /tmp/apk-out/app-release.apk
          ls -la /tmp/apk-out/

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-logs
          path: |
            /tmp/flutter-analyze.log
            /tmp/flutter-build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-studio-apk
          path: /tmp/apk-out/app-release.apk
          if-no-files-found: error
