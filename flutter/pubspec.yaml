name: ai_video_studio
description: Open-source AI video studio — character-consistent multi-scene generation.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  http: ^1.2.2
  path: ^1.9.0
  provider: ^6.1.2
  uuid: ^4.4.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model_manifest.json
